# Git hooks run before every commit.
# Install once from the repository root: uv run --project backend pre-commit install
# Evaluation cases are third-party or deliberately flawed code, and cached model
# answers are keyed by the exact prompt text: both are kept byte for byte.
exclude: ^eval/(dataset/cases|cache)/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-json
        exclude: ^frontend/tsconfig\.json$ # tsconfig allows comments
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1000"]
        exclude: (uv\.lock|package-lock\.json)$
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.6
    hooks:
      - id: ruff-check
        args: ["--fix"]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: mypy
        name: mypy (backend)
        entry: uv run --directory backend mypy
        language: system
        pass_filenames: false
        files: ^backend/app/.*\.py$

      - id: prettier
        name: prettier (frontend)
        entry: npm --prefix frontend run format:check
        language: system
        pass_filenames: false
        files: ^frontend/

      - id: eslint
        name: eslint (frontend)
        entry: npm --prefix frontend run lint
        language: system
        pass_filenames: false
        files: ^frontend/src/.*\.(ts|tsx)$
