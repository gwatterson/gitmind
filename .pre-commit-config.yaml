# Git hooks run before every commit.
# Install once from the repository root: uv run --project backend pre-commit install
# Evaluation cases are third-party or deliberately flawed code, and cached model
# answers are keyed by the exact prompt text: both are kept byte for byte.
exclude: ^eval/(dataset/cases|cache)/

repos:
  # Run as modules instead of through the generated console-script launchers, which
  # Windows application control (Smart App Control) can block as unknown executables.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
        entry: python -m pre_commit_hooks.end_of_file_fixer
      - id: trailing-whitespace
        entry: python -m pre_commit_hooks.trailing_whitespace_fixer
      - id: check-yaml
        entry: python -m pre_commit_hooks.check_yaml
      - id: check-toml
        entry: python -m pre_commit_hooks.check_toml
      - id: check-json
        entry: python -m pre_commit_hooks.check_json
        exclude: ^frontend/tsconfig\.json$ # tsconfig allows comments
      - id: check-merge-conflict
        entry: python -m pre_commit_hooks.check_merge_conflict
      - id: check-added-large-files
        entry: python -m pre_commit_hooks.check_added_large_files
        args: ["--maxkb=1000"]
        exclude: (uv\.lock|package-lock\.json)$
      - id: detect-private-key
        entry: python -m pre_commit_hooks.detect_private_key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.6
    hooks:
      - id: ruff-check
        args: ["--fix"]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: mypy
        name: mypy (backend)
        entry: uv run --directory backend mypy
        language: system
        pass_filenames: false
        files: ^backend/app/.*\.py$

      - id: prettier
        name: prettier (frontend)
        entry: npm --prefix frontend run format:check
        language: system
        pass_filenames: false
        files: ^frontend/

      - id: eslint
        name: eslint (frontend)
        entry: npm --prefix frontend run lint
        language: system
        pass_filenames: false
        files: ^frontend/src/.*\.(ts|tsx)$
