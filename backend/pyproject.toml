[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gitmind-backend"
version = "1.0.0"
description = "Autonomous Code Review Agent: backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "langgraph>=1.0,<2",
    "langchain-core>=1.0,<2",
    "langchain-google-genai>=4.0,<5",
    "mcp>=1.20,<3",
    "PyGithub>=2.4,<3",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.4,<3",
    "aiosqlite>=0.20,<1",
    "radon>=6.0,<7",
    "structlog>=24.0",
    "python-dotenv>=1.0,<2",
    # IANA time zone data: zoneinfo has no system database on Windows
    "tzdata>=2024.1",
    "pyjwt>=2.8,<3",
    "httpx>=0.27,<1",
    "slowapi>=0.1.9,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "respx>=0.21",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
omit = ["app/mcp_server/server.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["venv", ".venv"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "ASYNC", # flake8-async
    "S",     # flake8-bandit (security)
    "RUF",   # ruff-specific rules
]
ignore = [
    "E501",  # line length is handled by the formatter
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency injection idiom
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # asserts and fake secrets are fine in tests

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
# Strictness is enabled progressively (see PLAN.md F1.5)
files = ["app"]
