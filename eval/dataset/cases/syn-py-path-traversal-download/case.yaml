- file: app/routes/reports.py
  anchor: path = os.path.join(REPORTS_DIR, "archive", name)
  span: 3
  category: security
  cwe:
  - CWE-22
  - CWE-23
  - CWE-73
  severity_min: high
  description: User-controlled path joined to the reports directory and served
must_not_flag: []
